        // when the video player is ready, generate a random number, and play from that
        function onPlayerReady(event) {
            // create a random number between 0 and 200
            num = Math.floor(Math.random() * 199);

            // the timeout is set because of a bug with the youtube API. if you do any of this line without it, it won't affect anything
            // see: https://stackoverflow.com/questions/12916017/youtube-api-setshuffle-dont-work
            setTimeout(() => {
                player.playVideoAt(num);
                player.playVideo();
            }, 0);
        }

            <script>var lines;
var randomNumber;
var lastRandomNumber;

$(document.body).ready(function () {

  // load the trivia from the server
  $.ajax({
    url: '/misc/likedsongslibrary.txt'
  }).done(function(content) {

    // normalize the line breaks, then split into lines
    lines = content.replace(/\r\n|\r/g, '\n').trim().split('\n');

    // only set up the click handler if there were lines found
    if (lines && lines.length) {
      $('#showLine').on('click', function () {
        // loop to prevent repeating the last random number
        while (randomNumber === lastRandomNumber) {
          randomNumber = parseInt(Math.random() * lines.length);
          // check to prevent infinite loop
          if (lines.length === 1) { break; }
        }
        // keep track of the last random number
        lastRandomNumber = randomNumber;

        // show the corresponding line
        $('#song').text(lines[randomNumber]);
      });
    }
  });
});</script>
